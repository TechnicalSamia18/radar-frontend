# Daily watcher: checks every company in data/companies.json and saves the
# results to public/feed/, which the website reads. Vercel republishes the
# site when this commits. Also runs on demand (Actions → Daily watcher → Run).
name: Daily watcher
on:
  schedule:
    - cron: "17 1 * * *" # every day at 06:17 Pakistan time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/companies.json, scripts/watcher/**, .github/workflows/watch.yml]
permissions:
  contents: write # to commit the updated feed
concurrency:
  group: watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/watcher/watch.mjs
      - name: Commit the updated feed (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: daily watcher update ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
