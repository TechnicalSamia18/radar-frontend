# Runs every check on each push: dependency audit, lint, types, unit tests, production build,
# and the page tests in Chromium (desktop + phone) against that build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on any known advisory (moderate or worse) in code shipped to the
      # browser, and on High/Critical anywhere, including build and test tools.
      - run: npm run audit
      - run: npm run lint
      - run: npm test
      - run: npm run build # also type-checks
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
