# One-off coverage check: how many Pakistani software houses publish openings
# Radar could read for free? Prints a report to the run log and summary.
name: Coverage check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/coverage/**, .github/workflows/coverage.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/coverage/check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
